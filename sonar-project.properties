# Configuration SonarQube pour DAOS - Gestion des Enseignements UASZ
# Ce fichier définit les propriétés globales pour l'analyse de code statique

# Informations du projet
sonar.projectKey=daos-gestion-enseignements-uasz
sonar.projectName=DAOS - Gestion des Enseignements UASZ
sonar.projectVersion=1.0.0

# Organisation
sonar.organization=uasz

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Chemins des sources (tous les microservices)
sonar.sources=\
  config-server/src/main/java,\
  eureka-server/src/main/java,\
  api-gateway/src/main/java,\
  auth-service/src/main/java,\
  enseignant-service/src/main/java,\
  maquette-service/src/main/java,\
  choix-enseignement-service/src/main/java,\
  deroulement-enseignement-service/src/main/java,\
  emploi-temps-service/src/main/java,\
  front-end-main/src

# Chemins des tests
sonar.tests=\
  config-server/src/test/java,\
  eureka-server/src/test/java,\
  api-gateway/src/test/java,\
  auth-service/src/test/java,\
  enseignant-service/src/test/java,\
  maquette-service/src/test/java,\
  choix-enseignement-service/src/test/java,\
  deroulement-enseignement-service/src/test/java,\
  emploi-temps-service/src/test/java

# Exclusions
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/vendor/**,\
  **/*Test.java,\
  **/*IT.java,\
  **/GeneratePasswordHash.java,\
  **/ResetAdminPassword.java

# Binaires Java (pour l'analyse bytecode)
sonar.java.binaries=\
  config-server/target/classes,\
  eureka-server/target/classes,\
  api-gateway/target/classes,\
  auth-service/target/classes,\
  enseignant-service/target/classes,\
  maquette-service/target/classes,\
  choix-enseignement-service/target/classes,\
  deroulement-enseignement-service/target/classes,\
  emploi-temps-service/target/classes

# Bibliothèques (pour l'analyse des dépendances)
sonar.java.libraries=**/target/dependency/*.jar

# Rapports de couverture de code
sonar.coverage.jacoco.xmlReportPaths=\
  config-server/target/site/jacoco/jacoco.xml,\
  eureka-server/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  auth-service/target/site/jacoco/jacoco.xml,\
  enseignant-service/target/site/jacoco/jacoco.xml,\
  maquette-service/target/site/jacoco/jacoco.xml,\
  choix-enseignement-service/target/site/jacoco/jacoco.xml,\
  deroulement-enseignement-service/target/site/jacoco/jacoco.xml,\
  emploi-temps-service/target/site/jacoco/jacoco.xml

# Rapports de tests
sonar.junit.reportPaths=\
  config-server/target/surefire-reports,\
  eureka-server/target/surefire-reports,\
  api-gateway/target/surefire-reports,\
  auth-service/target/surefire-reports,\
  enseignant-service/target/surefire-reports,\
  maquette-service/target/surefire-reports,\
  choix-enseignement-service/target/surefire-reports,\
  deroulement-enseignement-service/target/surefire-reports,\
  emploi-temps-service/target/surefire-reports

# Niveau de log
sonar.log.level=INFO

# Analyse JavaScript/TypeScript pour le frontend
sonar.javascript.lcov.reportPaths=front-end-main/coverage/lcov.info

# Quality Gates - Seuils de qualité
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Règles de sécurité
sonar.java.checkstyle.reportPaths=**/target/checkstyle-result.xml
sonar.java.pmd.reportPaths=**/target/pmd.xml
sonar.java.spotbugs.reportPaths=**/target/spotbugsXml.xml

# Duplication de code
sonar.cpd.exclusions=**/*Config.java,**/*Application.java

# Complexité cyclomatique maximale
sonar.complexity.threshold=15

# Taille maximale des méthodes
sonar.methodsize.threshold=50

# Nombre maximum de paramètres
sonar.maxparameters.threshold=7
