# Configuration commune � tous les microservices

# Port Configuration
server.port=8888
spring.application.name=config-server

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,refresh,env,configprops
management.endpoint.health.show-details=always


# Config Server Native Mode
spring.cloud.config.server.native.search-locations=classpath:/config-repo
spring.profiles.active=native

# Eureka Configuration
eureka.client.service-url.defaultZone=http://admin:admin@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# Logging
#logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.cloud.config=INFO
logging.level.org.springframework.cloud.config.server=DEBUG

# Encryption Configuration
# Clé symétrique pour le chiffrement des propriétés
encrypt.key=${ENCRYPT_KEY:daos-secret-encryption-key-change-in-production}

# Security Configuration
spring.security.user.name=${CONFIG_SERVER_USERNAME:configadmin}
spring.security.user.password=${CONFIG_SERVER_PASSWORD:configadmin}



