# Configuration Enseignant Service - Environnement Développement

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/daos_enseignant_db?createDatabaseIfNotExist=true
    username: root
    password: ""

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# Swagger - Activé
springdoc:
  swagger-ui:
    enabled: true

# Actuator - Tous les endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Logging - Verbeux
logging:
  level:
    com.uasz.daos.enseignant: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
