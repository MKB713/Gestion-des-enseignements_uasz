# Configuration spécifique à Enseignant Service

# Server Port
server.port=8082

# Application Name
spring.application.name=enseignant-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daos_enseignant_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger Configuration
springdoc.packages-to-scan=com.uasz.daos.enseignant.controller,com.uasz.daos.enseignant.api

# Logging
logging.level.com.uasz.daos.enseignant=DEBUG
