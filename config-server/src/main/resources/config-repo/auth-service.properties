# Configuration spécifique à Auth Service

# Server Port
server.port=8081

# Application Name
spring.application.name=auth-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daos_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Swagger Configuration
springdoc.packages-to-scan=com.uasz.daos.auth.controller

# Logging
logging.level.com.uasz.daos.auth=DEBUG
