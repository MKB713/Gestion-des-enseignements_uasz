# Configuration pour l'environnement de production

server.port=8084

# Database Configuration - PROD
spring.datasource.url=jdbc:mysql://prod-db-server:3306/daos_choix_enseignement_db
spring.datasource.username=prod_user
spring.datasource.password={cipher}ENCRYPTED_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - PROD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Eureka Configuration - PROD
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Swagger/OpenAPI Configuration - PROD
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.packages-to-scan=com.uasz.daos.choix.controller

# Logging - PROD (moins verbeux)
logging.level.com.uasz.daos.choix=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Message de test pour @RefreshScope
app.message=Configuration PROD chargée depuis Config Server
app.environment=production