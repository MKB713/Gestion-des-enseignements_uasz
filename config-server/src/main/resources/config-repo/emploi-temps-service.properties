# Configuration spécifique à Emploi Temps Service

# Server Port
server.port=8085

# Application Name
spring.application.name=emploi-temps-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daos_emploi_temps_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger Configuration
springdoc.packages-to-scan=com.uasz.daos.emploi.controller

# Logging
logging.level.com.uasz.daos.emploi=DEBUG
