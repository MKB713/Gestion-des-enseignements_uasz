# Configuration Auth Service - Environnement Développement

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/daos_auth_db?createDatabaseIfNotExist=true
    username: root
    password: ""

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# JWT - Expiration longue pour développement
jwt:
  expiration: 86400000 # 24 heures

# Swagger - Activé
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Actuator - Tous les endpoints exposés
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging - Verbeux
logging:
  level:
    com.uasz.daos.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
