
logging.level.com.uasz.daos.choix.client=DEBUG
feign.client.config.default.loggerLevel=FULL

# Timeout Configuration (optionnel)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
# Configuration du serveur
spring.application.name=choix-enseignement-service
server.port=8084


spring.datasource.url=jdbc:mysql://localhost:3306/daos_choix_enseignement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuration de logging
logging.level.root=INFO
logging.level.com.uasz.daos.choix=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration Jackson pour les dates
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Configuration des erreurs
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Configuration Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Eureka Configuration
eureka.client.service-url.defaultZone=http://admin:admin@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.uasz.daos.choix.controller

spring.config.import=optional:configserver:

spring.main.allow-bean-definition-overriding=true
