# Configuration du serveur
spring.application.name=choix-enseignement-service
server.port=8084

# Configuration de la base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/daos_choix_enseignement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuration de logging
logging.level.root=INFO
logging.level.com.uasz.daos.choix=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration Jackson pour les dates
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Configuration des erreurs
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Configuration de la pagination par défaut
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Configuration Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always