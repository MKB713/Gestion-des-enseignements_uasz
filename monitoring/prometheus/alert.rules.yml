groups:
  - name: daos_alerts
    interval: 30s
    rules:
      # Service Down Alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."

      # High CPU Usage
      - alert: HighCpuUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on {{ $labels.application }}"
          description: "CPU usage is above 80% for {{ $labels.application }} for more than 5 minutes."

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage on {{ $labels.application }}"
          description: "Memory usage is above 90% for {{ $labels.application }}."

      # High HTTP Error Rate
      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High HTTP error rate on {{ $labels.application }}"
          description: "HTTP error rate is above 5% for {{ $labels.application }}."

      # Slow HTTP Requests
      - alert: SlowHttpRequests
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow HTTP requests on {{ $labels.application }}"
          description: "95th percentile of HTTP requests is above 2 seconds for {{ $labels.application }}."

      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolExhaustion
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection pool near exhaustion on {{ $labels.application }}"
          description: "Connection pool usage is above 90% for {{ $labels.application }}."

      # Eureka Server Down
      - alert: EurekaServerDown
        expr: up{job="eureka-server"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Eureka Server is down"
          description: "Service discovery is unavailable. All microservices may be affected."

      # Config Server Down
      - alert: ConfigServerDown
        expr: up{job="config-server"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Config Server is down"
          description: "Configuration service is unavailable. Services cannot fetch configuration."

      # API Gateway Down
      - alert: ApiGatewayDown
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "API Gateway is down"
          description: "Main entry point is unavailable. All external requests are failing."

      # High Request Latency at Gateway
      - alert: HighGatewayLatency
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{job="api-gateway"}[5m])) > 3
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency at API Gateway"
          description: "99th percentile latency is above 3 seconds at the API Gateway."

      # JVM Garbage Collection Time High
      - alert: HighGcTime
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High GC time on {{ $labels.application }}"
          description: "Garbage collection is taking more than 10% of CPU time."

      # Too Many Threads
      - alert: TooManyThreads
        expr: jvm_threads_live > 200
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Too many threads on {{ $labels.application }}"
          description: "Thread count is above 200 for {{ $labels.application }}."

      # Disk Space Low (for containers)
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Disk space is low"
          description: "Available disk space is below 10%."
