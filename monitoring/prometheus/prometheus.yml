# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'daos-cluster'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alert.rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Eureka Server
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
        labels:
          application: 'eureka-server'
          service: 'infrastructure'

  # Config Server
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8888']
        labels:
          application: 'config-server'
          service: 'infrastructure'

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'api-gateway'
          service: 'infrastructure'

  # Auth Service
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          application: 'auth-service'
          service: 'business'

  # Enseignant Service
  - job_name: 'enseignant-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enseignant-service:8082']
        labels:
          application: 'enseignant-service'
          service: 'business'

  # Maquette Service
  - job_name: 'maquette-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['maquette-service:8083']
        labels:
          application: 'maquette-service'
          service: 'business'

  # Choix Enseignement Service
  - job_name: 'choix-enseignement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['choix-enseignement-service:8084']
        labels:
          application: 'choix-enseignement-service'
          service: 'business'

  # Emploi Temps Service
  - job_name: 'emploi-temps-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['emploi-temps-service:8085']
        labels:
          application: 'emploi-temps-service'
          service: 'business'

  # Déroulement Enseignement Service
  - job_name: 'deroulement-enseignement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['deroulement-enseignement-service:8086']
        labels:
          application: 'deroulement-enseignement-service'
          service: 'business'

  # MySQL Exporter (si configuré)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'database'

  # Redis Exporter (si configuré)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'

  # Node Exporter (métriques système)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
