global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true

    # Warning alerts - batched notification
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s
      group_interval: 5m

    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'infrastructure-receiver'
      continue: true

    # Database alerts
    - match:
        category: database
      receiver: 'database-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true
    # Exemple: configuration email (à adapter)
    # email_configs:
    #   - to: 'admin@daos.uasz.sn'
    #     from: 'alertmanager@daos.uasz.sn'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alertmanager@daos.uasz.sn'
    #     auth_password: 'your-password'
    #     headers:
    #       Subject: '[CRITICAL] DAOS Alert: {{ .GroupLabels.alertname }}'

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/warning'
        send_resolved: true

  - name: 'infrastructure-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/infrastructure'
        send_resolved: true

  - name: 'database-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/database'
        send_resolved: true

inhibit_rules:
  # Inhibit warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit service alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

templates:
  - '/etc/alertmanager/templates/*.tmpl'
