# ============================================================================
# STAGE 2: TEST - Tests unitaires et d'intégration
# ============================================================================

test:unit:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running unit tests for all services..."
    - |
      for service in config-server eureka-server api-gateway auth-service enseignant-service maquette-service choix-enseignement-service deroulement-enseignement-service emploi-temps-service; do
        if [ -d "$service" ]; then
          echo "Testing $service..."
          cd $service
          mvn test -Dtest=**/*Test || echo "No tests found for $service"
          cd ..
        fi
      done
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/surefire-reports/"
      - "*/target/site/jacoco/"
    expire_in: 1 week
  tags:
    - docker

test:integration:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - mysql:8.0
    - redis:7-alpine
  variables:
    MYSQL_ROOT_PASSWORD: "root"
    MYSQL_DATABASE: "daos_test"
    REDIS_HOST: "redis"
  script:
    - echo "Running integration tests..."
    - |
      for service in auth-service enseignant-service maquette-service choix-enseignement-service deroulement-enseignement-service emploi-temps-service; do
        if [ -d "$service" ]; then
          echo "Integration testing $service..."
          cd $service
          mvn verify -DskipUnitTests=true -Dtest=**/*IT || echo "No integration tests found for $service"
          cd ..
        fi
      done
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/failsafe-reports/TEST-*.xml"
    paths:
      - "*/target/failsafe-reports/"
    expire_in: 1 week
  allow_failure: true
  tags:
    - docker

test:frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd front-end-main
    - npm ci
    - npm run test -- --coverage --watchAll=false || echo "No frontend tests configured"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - front-end-main/coverage/
    expire_in: 1 week
  allow_failure: true
  only:
    changes:
      - front-end-main/**/*
      - .gitlab-ci.yml
  tags:
    - docker

# ============================================================================
# STAGE 3: ANALYZE - Analyse de code statique avec SonarQube
# ============================================================================

sonarqube:backend:
  stage: analyze
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Running SonarQube analysis for backend services..."
    - |
      for service in config-server eureka-server api-gateway auth-service enseignant-service maquette-service choix-enseignement-service deroulement-enseignement-service emploi-temps-service; do
        if [ -d "$service" ]; then
          echo "Analyzing $service with SonarQube..."
          cd $service
          mvn sonar:sonar \
            -Dsonar.projectKey=daos-$service \
            -Dsonar.projectName="DAOS - $service" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml || echo "SonarQube analysis failed for $service"
          cd ..
        fi
      done
  allow_failure: true
  only:
    - main
    - develop
  tags:
    - docker

sonarqube:frontend:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - cd front-end-main
    - |
      sonar-scanner \
        -Dsonar.projectKey=daos-frontend \
        -Dsonar.projectName="DAOS - Frontend" \
        -Dsonar.sources=src \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info || echo "SonarQube analysis failed for frontend"
  allow_failure: true
  only:
    - main
    - develop
    changes:
      - front-end-main/**/*
      - .gitlab-ci.yml
  tags:
    - docker

