# ============================================================================
# STAGE 5: DOCKER PUSH - Push des images vers le registry
# ============================================================================

docker:push:
  stage: docker-push
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Pushing all Docker images to registry..."
    - |
      for service in config-server eureka-server api-gateway auth-service enseignant-service maquette-service choix-enseignement-service deroulement-enseignement-service emploi-temps-service frontend; do
        echo "Pushing $service images..."
        docker push $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHORT_SHA || echo "Image $service:$CI_COMMIT_SHORT_SHA not found locally"
        docker push $CI_REGISTRY_IMAGE/$service:latest || echo "Image $service:latest not found locally"
      done
  only:
    - main
    - develop
  tags:
    - docker

# ============================================================================
# STAGE 6: DEPLOY - Déploiement automatique en environnement de test
# ============================================================================

deploy:test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose curl
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $TEST_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to test environment..."
    - |
      ssh $TEST_SERVER_USER@$TEST_SERVER_HOST << 'EOF'
        cd /opt/daos
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

        # Pull latest images
        docker-compose pull

        # Stop and remove old containers
        docker-compose down

        # Start new containers
        docker-compose up -d

        # Wait for services to be healthy
        sleep 30

        # Health check
        curl -f http://localhost:8761/actuator/health || exit 1
        curl -f http://localhost:8888/actuator/health || exit 1
        curl -f http://localhost:8080/actuator/health || exit 1

        echo "Deployment successful!"
      EOF
  environment:
    name: test
    url: http://$TEST_SERVER_HOST:8080
  only:
    - develop
  when: manual
  tags:
    - docker

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose curl
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production environment..."
    - |
      ssh $PROD_SERVER_USER@$PROD_SERVER_HOST << 'EOF'
        cd /opt/daos
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

        # Backup current state
        docker-compose ps > backup-$(date +%Y%m%d-%H%M%S).txt

        # Pull latest images
        docker-compose pull

        # Rolling update
        docker-compose up -d --no-deps --build

        # Health check
        sleep 60
        curl -f http://localhost:8761/actuator/health || exit 1
        curl -f http://localhost:8888/actuator/health || exit 1
        curl -f http://localhost:8080/actuator/health || exit 1

        echo "Production deployment successful!"
      EOF
  environment:
    name: production
    url: https://$PROD_SERVER_HOST
  only:
    - main
  when: manual
  tags:
    - docker

# ============================================================================
# STAGE 7: NOTIFY - Notifications des résultats
# ============================================================================

notify:success:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST "$EMAIL_NOTIFICATION_URL" \
        -H "Content-Type: application/json" \
        -d "{
          \"to\": \"$NOTIFICATION_EMAIL\",
          \"subject\": \"✅ Pipeline CI/CD DAOS - SUCCESS\",
          \"body\": \"Pipeline #$CI_PIPELINE_ID completed successfully for commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME by $GITLAB_USER_NAME\"
        }" || echo "Email notification failed"
  when: on_success
  only:
    - main
    - develop
  tags:
    - docker

notify:failure:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST "$EMAIL_NOTIFICATION_URL" \
        -H "Content-Type: application/json" \
        -d "{
          \"to\": \"$NOTIFICATION_EMAIL\",
          \"subject\": \"❌ Pipeline CI/CD DAOS - FAILED\",
          \"body\": \"Pipeline #$CI_PIPELINE_ID FAILED for commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME by $GITLAB_USER_NAME. Check: $CI_PIPELINE_URL\"
        }" || echo "Email notification failed"
  when: on_failure
  only:
    - main
    - develop
  tags:
    - docker
