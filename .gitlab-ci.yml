# Pipeline CI/CD pour DAOS - Gestion des Enseignements UASZ
# Automatise: Build, Test, Analyse, Docker Build/Push, Déploiement

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_URL: "registry.gitlab.com"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SONAR_HOST_URL: "${SONAR_HOST_URL}"
  SONAR_TOKEN: "${SONAR_TOKEN}"

# Cache Maven dependencies pour accélérer les builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - node_modules/

# Stages du pipeline
stages:
  - build
  - test
  - analyze
  - docker-build
  - docker-push
  - deploy
  - notify

# ============================================================================
# STAGE 1: BUILD - Compilation de tous les microservices
# ============================================================================

build:config-server:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Building Config Server..."
    - cd config-server
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - config-server/target/
    expire_in: 1 hour
  only:
    changes:
      - config-server/**/*
      - .gitlab-ci.yml
  tags:
    - docker

