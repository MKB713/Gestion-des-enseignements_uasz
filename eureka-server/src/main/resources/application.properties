# Application Name
spring.application.name=eureka-server

# Server Port (default for standalone mode)
server.port=8761

# Standalone Mode Configuration (Development)
# Ne s'enregistre pas lui-même car il est seul
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Server Configuration
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000

# Dashboard Configuration
eureka.dashboard.enabled=true

# Instance Configuration
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Logging
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Security Configuration
eureka.security.username=${EUREKA_USERNAME:admin}
eureka.security.password=${EUREKA_PASSWORD:admin}

