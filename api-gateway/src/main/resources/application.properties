# ==========================================
# CONFIGURATION SERVEUR & APPLICATION
# ==========================================
server.port=8080
spring.application.name=api-gateway

# ==========================================
# EUREKA CLIENT (SERVICE REGISTRY)
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web.cors=DEBUG

# ==========================================
# ROUTES API
# ==========================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- 1. SERVICE AUTHENTIFICATION ---
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# --- 2. SERVICE ENSEIGNANTS ---
spring.cloud.gateway.routes[1].id=enseignant-service
spring.cloud.gateway.routes[1].uri=lb://enseignant-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/enseignants/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# --- 3. SERVICE MAQUETTES (CORRIGÉ) ---
# Appel Front: GET /api/maquette/filieres
# Vers Service: GET /api/maquette/filieres (On garde le chemin complet)
spring.cloud.gateway.routes[2].id=maquette-service
spring.cloud.gateway.routes[2].uri=lb://maquette-service
# ATTENTION : 'maquette' au singulier pour correspondre aux contrôleurs Java
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/maquette/**
# ATTENTION : On RETIRE StripPrefix pour que le backend reçoive le chemin complet

# --- 4. SERVICE CHOIX ENSEIGNEMENT ---
spring.cloud.gateway.routes[3].id=choix-enseignement-service
spring.cloud.gateway.routes[3].uri=lb://choix-enseignement-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/choix/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# --- 5. SERVICE EMPLOI DU TEMPS ---
spring.cloud.gateway.routes[4].id=emploi-temps-service
spring.cloud.gateway.routes[4].uri=lb://emploi-temps-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/emploi-temps/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# --- 6. SERVICE DEROULEMENT ---
spring.cloud.gateway.routes[5].id=deroulement-enseignement-service
spring.cloud.gateway.routes[5].uri=lb://deroulement-enseignement-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/deroulement/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1


# ==========================================
# CONFIGURATION CORS GLOBALE (RADICALE)
# ==========================================
# Autorise toutes les origines (React, Postman, Mobile...)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
# Si la ligne ci-dessus ne marche pas avec votre version, essayez :
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*

# Autorise toutes les méthodes
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

# Autorise tous les headers
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# Autorise l'envoi de cookies/credentials
# Attention: Si vous mettez allowed-origins=*, il faut parfois mettre allow-credentials=false
# Pour le dev local simple, essayons d'abord sans credentials ou avec origin specific
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false