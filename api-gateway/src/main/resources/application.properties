server.port=8080
spring.application.name=api-gateway

# Eureka Configuration
eureka.client.service-url.defaultZone=http://admin:admin@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# ROUTES

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**

# Maquette Service (Singular and Plural support)
spring.cloud.gateway.routes[1].id=maquette-service
spring.cloud.gateway.routes[1].uri=lb://MAQUETTE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/maquette/**, /api/maquettes/**

# Emploi du Temps Service
spring.cloud.gateway.routes[2].id=emploi-temps-service
spring.cloud.gateway.routes[2].uri=lb://EMPLOI-TEMPS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/emploi-temps/**, /api/emploi-du-temps/**, /api/seances/**, /api/salles/**, /api/batiments/**

# Deroulement Enseignement Service
spring.cloud.gateway.routes[3].id=deroulement-service
spring.cloud.gateway.routes[3].uri=lb://DEROULEMENT-ENSEIGNEMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/deroulement-enseignements/**, /api/notes-cahier/**, /api/classes/**, /api/etudiants/**

# Enseignant Service
spring.cloud.gateway.routes[4].id=enseignant-service
spring.cloud.gateway.routes[4].uri=lb://ENSEIGNANT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/enseignants/**
