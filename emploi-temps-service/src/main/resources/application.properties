server.port=8085

spring.application.name=emploi-temps-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daos_emploi_temps_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://admin:admin@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.uasz.daos.emploi.controller


# ========== CONFIGURATION SERVICE PYTHON ==========

# URL du service Python de génération d'emploi du temps
python.generator.url=http://localhost:8000

# Timeout pour les appels au service Python (en millisecondes)
python.generator.timeout=60000

# Nombre de tentatives en cas d'échec
python.generator.retry.attempts=3


# Configuration Redis (si utilisé)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=60000

# Configuration du cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Alternative : Cache en mémoire (si Redis non disponible)
# spring.cache.type=simple

# Pour afficher les endpoints non-annot�s
springdoc.show-actuator=true
spring.config.import=optional:configserver: